<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Message Sent · Ashforge Studio</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Pro:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Parchment palette - identical to index.html so every page in the
       site resolves the same token names to the same values. */
    :root {
      --paper: #dbbd94; --paper-mid: #cdab80; --paper-deep: #c6a173;
      --dark: #22261f; --dark-deep: #171a15;
      --ink: #2a2018; --ink-soft: #4c3c2b; --ink-faint: #584734;
      --cream: #eadfc6; --cream-dim: #c3b291; --cream-faint: #b5a085;
      --gold-warm: #c08b3c; --gold-bright: #ddab55; --gold-deep: #8a5f24;
      --on-gold: #2a1d0a;

      --bg: var(--dark-deep); --bg2: #1b1f19; --bg3: var(--dark);
      --surface: #2a2e26; --surface2: #333829;
      --border: rgba(190,160,100,0.18); --border-bright: rgba(190,160,100,0.34);
      --ember: var(--gold-warm); --ember-dim: var(--gold-deep); --ember-glow: var(--gold-bright);
      --crimson: #7a3b1e;
      --gold: var(--gold-bright); --gold-dim: var(--gold-warm);
      --text: var(--cream); --text-dim: var(--cream-dim); --text-faint: var(--cream-faint);
      --font-head: 'Cinzel', Georgia, serif; --font-body: 'Crimson Pro', Georgia, serif;
    }
    .ground-paper {
      --bg: var(--paper); --bg2: var(--paper-mid); --bg3: var(--paper-deep);
      --surface: rgba(255,248,232,0.34); --surface2: rgba(255,248,232,0.52);
      --border: rgba(120,92,52,0.34); --border-bright: rgba(90,66,32,0.55);
      /* burnt umber: --ember is both accent text and button fill, and
         mid-gold cleared AA for neither on paper. See index.html */
      --ember: #684314; --ember-dim: #4f3210; --ember-glow: var(--gold-deep);
      --gold: #684314; --gold-dim: #4f3210; --on-gold: var(--cream);
      --text: var(--ink); --text-dim: var(--ink-soft); --text-faint: var(--ink-faint);
    }

    /* -- Rhythm system (see index.html) -- */
    .sec { position: relative; }
    .torn {
      --tear-h: 56px; --tear-w: 100%; --tear-x: 0px;
      --tear-src: url('uploads/texture/tear-mask.png');
      position: relative; z-index: 1;
      -webkit-mask-image: linear-gradient(#000, #000), var(--tear-src);
              mask-image: linear-gradient(#000, #000), var(--tear-src);
      -webkit-mask-size: 100% calc(100% - var(--tear-h) + 1px), var(--tear-w) var(--tear-h);
              mask-size: 100% calc(100% - var(--tear-h) + 1px), var(--tear-w) var(--tear-h);
      -webkit-mask-position: left top, var(--tear-x) bottom;
              mask-position: left top, var(--tear-x) bottom;
      -webkit-mask-repeat: no-repeat, no-repeat;
              mask-repeat: no-repeat, no-repeat;
    }
    .tuck {
      --tuck: 56px; position: relative; z-index: 0;
      margin-top: calc(var(--tuck) * -1); padding-top: calc(var(--tuck) + 26px);
    }
    .ground-paper {
      background-color: var(--paper);
      background-image:
        linear-gradient(158deg, rgba(244,230,201,0.5), rgba(219,189,148,0.16) 58%, rgba(186,150,104,0.34)),
        url('uploads/texture/paper-tile.webp');
      background-size: auto, 520px; background-repeat: no-repeat, repeat;
      background-blend-mode: normal, overlay; color: var(--ink);
    }
    .ground-dark {
      background-color: var(--dark);
      background-image:
        linear-gradient(rgba(24,28,22,0.35), rgba(16,20,15,0.55)),
        url('uploads/texture/dark-panel.webp');
      background-size: auto, 760px; background-repeat: no-repeat, repeat;
      background-blend-mode: normal, overlay; color: var(--cream);
    }
    /* overflow clips .map-layer's 2% bleed - see index.html */
    .ground-map { background: var(--dark-deep); color: var(--cream); isolation: isolate; overflow: hidden; }
    /* Grounds must be self-contained: a dark or map ground can sit
       inside a paper one (a map header on a paper article page), and
       without this reset it would inherit ink-on-paper tokens and
       render dark type on a dark ground. Each ground re-points the
       full set, so nesting works in any order. */
    .ground-dark, .ground-map, #main-nav, .nav-mobile-menu {
      --bg: var(--dark-deep); --bg2: #1b1f19; --bg3: var(--dark);
      --surface: #2a2e26; --surface2: #333829;
      --border: rgba(190,160,100,0.18); --border-bright: rgba(190,160,100,0.34);
      --ember: var(--gold-warm); --ember-dim: var(--gold-deep); --ember-glow: var(--gold-bright);
      --gold: var(--gold-bright); --gold-dim: var(--gold-warm);
      --on-gold: #2a1d0a;
      --text: var(--cream); --text-dim: var(--cream-dim); --text-faint: var(--cream-faint);
    }

    .ground-map .map-layer {
      position: absolute; inset: -2%;
      background: url('uploads/texture/map.webp') center 72% / cover no-repeat;
      pointer-events: none;
    }
    .ground-map .map-shade {
      position: absolute; inset: 0; pointer-events: none;
      background:
        linear-gradient(to right, rgba(28,22,15,0.62), rgba(28,22,15,0.32) 50%, rgba(28,22,15,0.5)),
        radial-gradient(ellipse 130% 110% at 40% 45%, transparent 34%, rgba(20,16,10,0.42) 78%, rgba(14,11,7,0.72) 100%);
    }
    /* Copy sitting straight on the map needs far more shade or the
       type dissolves into the cartography. */
    .ground-map.dense .map-shade {
      background:
        linear-gradient(rgba(18,21,14,0.80), rgba(13,16,11,0.86)),
        radial-gradient(ellipse 120% 100% at 45% 40%, rgba(20,16,10,0.3), rgba(12,14,9,0.7) 100%);
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 56px 48px;
      text-align: center;
    }
    .rune {
      width: 14px; height: 14px;
      background: var(--ember);
      transform: rotate(45deg);
      margin: 0 auto 28px;
    }
    .eyebrow {
      font-family: var(--font-head);
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ember);
      margin-bottom: 16px;
    }
    h1 {
      font-family: var(--font-head);
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    p {
      font-size: 17px;
      color: var(--text-dim);
      line-height: 1.65;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--ember);
      color: var(--on-gold);
      font-family: var(--font-head);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 2px;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--ember-glow); }
  </style>
</head>
<body class="ground-dark">
  <main class="card">
    <div class="rune"></div>
    <div class="eyebrow">Sent to the Forge</div>
    <h1>Your message is on the anvil.</h1>
    <p>Thanks for reaching out. I'll get back to you within 2 business days. In the meantime, the work continues.</p>
    <a href="/" class="btn">Back to Ashforge Studio</a>
  </main>
</body>
</html>
